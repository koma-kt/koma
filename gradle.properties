# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Kotlin
kotlin.code.style=official
# kotlin.js.compiler=ir // Deprecated: the IR compiler is the default and only option since Kotlin 2.0
# MPP
kotlin.mpp.enableCInteropCommonization=true
# Work around Kotlin/Native cache build failures on iOS simulator test linking.
kotlin.native.cacheKind.iosSimulatorArm64=none
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Actron publications. Override these properties for private builds.
actron.fork.group=io.github.roman-n1
actron.fork.version=1.0.0-beta.1
# Historical upstream base; independent of the Actron version.
actron.upstream.base=4.0.0
# Canonical source repository for publication metadata.
actron.fork.url=https://github.com/roman-n1/actron/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
