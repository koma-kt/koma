# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  # Every pull request, whatever its base: a PR stacked on another PR's branch is checked too.
  pull_request:
  workflow_call:

permissions:
  contents: read

# Keep the newest PR checks; release verification is never cancelled by a branch update.
concurrency:
  group: gradle-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-26
            # Device budgets have a dedicated measured soak workflow.
            gradle-options: -x :resource-soak:iosSimulatorArm64Test
          - target: testAndroidHostTest
            os: ubuntu-latest
          - target: jvmTest
            os: ubuntu-latest
          - target: jsBrowserTest
            os: ubuntu-latest
            # Compose JS executable linking exceeds the default 2 GiB compiler heap.
            # Compile modules serially to keep concurrent heaps within the runner budget.
            gradle-options: --no-parallel --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx4g
          - target: wasmJsBrowserTest
            os: ubuntu-latest
            # Compose Wasm test executables need the same bounded compiler budget as JS.
            gradle-options: --no-parallel --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx4g
          # The device target is compiled where the simulator is tested; a device build needs a Mac.
          - target: apiCheck checkDebugGraph compileKotlinIosArm64
            os: macos-26
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Only quality ratchets compare Git history.
          fetch-depth: ${{ matrix.target == 'jvmTest' && '0' || '1' }}
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5
      - uses: actions/cache@v5
        if: runner.os == 'macOS'
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check Kotlin code style
        if: matrix.target == 'jvmTest'
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          if [[ "$QUALITY_BASE" =~ ^0+$ ]] || [[ -z "$QUALITY_BASE" ]]; then
            ./gradlew ktlintCheck detekt
          else
            ./gradlew ktlintCheck detekt -Pactron.quality.base="$QUALITY_BASE"
          fi
      - name: Check null and optional policy
        if: matrix.target == 'jvmTest'
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$POLICY_BASE" =~ ^0+$ ]] || [[ -z "$POLICY_BASE" ]]; then
            ./gradlew checkNullability
          else
            ./gradlew checkNullability -Pactron.nullability.base="$POLICY_BASE"
          fi
      - name: Build with Gradle
        run: ./gradlew ${{ matrix.target }} ${{ matrix.gradle-options }}
