name: Device resource budgets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: Minimum soak seconds per platform (3..3600)
        required: true
        default: '300'

permissions:
  contents: read

env:
  SOAK_SECONDS: ${{ inputs.seconds || '300' }}

# Keep the newest PR checks; release verification is never cancelled by a branch update.
concurrency:
  group: device-resource-budgets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-resource-budgets:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Check report validator regressions
        run: python3 -m unittest discover -s verification/resource-soak -p 'test_verify_report.py'
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Run iOS simulator resource soak
        run: ./gradlew :resource-soak:iosSimulatorArm64Test -PsoakSeconds="$SOAK_SECONDS" --max-workers=2 --console=plain
      - name: Validate native measurements
        run: python3 verification/resource-soak/verify-report.py verification/resource-soak/build/reports/resource-soak/ios iOS "$SOAK_SECONDS"
      - name: Upload native measurements and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-resource-budgets
          path: |
            verification/resource-soak/build/reports/
            verification/resource-soak/build/test-results/

  android-resource-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator resource soak
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash verification/resource-soak/run-android.sh "$SOAK_SECONDS"
      - name: Upload Android measurements and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-resource-budgets
          path: |
            verification/resource-soak/build/reports/
            verification/resource-soak/build/outputs/androidTest-results/
