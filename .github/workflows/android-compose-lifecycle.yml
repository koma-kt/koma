name: Android Compose lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest PR checks; release verification is never cancelled by a branch update.
concurrency:
  group: android-compose-lifecycle-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-compose-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Activity recreation and recording document picker tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Both suites own the same foreground device and must not run concurrently.
          script: ./gradlew :actron-compose:connectedAndroidDeviceTest :weather:androidApp:connectedDebugAndroidTest --max-workers=2 --no-parallel
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compose-lifecycle-results
          path: |
            actron-compose/build/reports/androidTests/
            actron-compose/build/outputs/androidTest-results/
            examples/weather/androidApp/build/reports/androidTests/
            examples/weather/androidApp/build/outputs/androidTest-results/
