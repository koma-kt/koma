name: Recording filesystem durability

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest PR checks; release verification is never cancelled by a branch update.
concurrency:
  group: recording-durability-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Create isolated 8 MiB filesystem
        shell: bash
        run: |
          directory="$RUNNER_TEMP/actron-enospc"
          mkdir -p "$directory"
          sudo mount -t tmpfs -o size=8M,mode=1777 tmpfs "$directory"
          touch "$directory/.actron-bounded-filesystem"
          echo "ACTRON_ENOSPC_DIRECTORY=$directory" >> "$GITHUB_ENV"
      - name: Process kill and actual ENOSPC regression tests
        shell: bash
        run: |
          test -n "$ACTRON_ENOSPC_DIRECTORY"
          test -f "$ACTRON_ENOSPC_DIRECTORY/.actron-bounded-filesystem"
          ./gradlew :actron-timetravel:jvmTest --tests '*RecordingDurabilityJvmTest' --rerun-tasks
      - name: Unmount isolated filesystem
        if: always()
        shell: bash
        run: |
          directory="$RUNNER_TEMP/actron-enospc"
          if mountpoint -q "$directory"; then sudo umount "$directory"; fi
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recording-durability-reports
          path: actron-timetravel/build/reports/tests/jvmTest
